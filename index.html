
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find and compare student accommodation in Mankweng.">
    <title>StudentStay | Student Accommodation</title>

    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
   <header>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="./" class="logo">StudentStay</a>

        <button
            type="button"
            class="menu-toggle"
            id="menu-toggle"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="main-nav"
        >
            ☰
        </button>

        <div class="nav-links" id="main-nav">
            <a href="#listings">Find Accommodation</a>
            <a href="#about">About</a>
        </div>
    </nav>
</header>

    <main>
        

        <section class="search-section" id="search">
            <h1>Find Student Accommodation</h1>
            <p class="search-intro">
                Search rooms and residences in Mankweng.
            </p>

            <form class="search-form">
                <input
                    type="search"
                    placeholder="Search by location (e.g. Unit E, Gate 2)"
                    aria-label="Search accommodation by location"
                >
                
                
                <select id="budget-filter" aria-label="Maximum monthly budget">
                    <option value="">Any budget</option>
                    <option value="2000">Up to R2,000</option>
                    <option value="2500">Up to R2,500</option>
                    <option value="3000">Up to R3,000</option>
                    <option value="4000">Up to R4,000</option>
                    <option value="5000">Up to R5,000</option>
                </select>

                            
                <select id="sort-filter" aria-label="Sort accommodation by price">
                    <option value="default">Default order</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>


                <button type="submit">Search</button>
            </form>

            <p class="search-message" aria-live="polite"></p>
        </section>

        <section id="listings" hidden>
            <h2>Available Accommodation</h2>
            <div id="accommodation-list"></div>
        </section>

        <section id="residence-details" hidden>
            <button id="back-to-listings" type="button">
                 Back to Listings
            </button>
            <div id="details-content"></div>
        </section>

    
<script type="module" src="/src/script.js"></script>
</body>
</html>
